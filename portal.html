<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal Sign-In | Clinic OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary: #0052CC;
            --primary-dark: #0747A6;
            --secondary: #172B4D;
            --bg-base: #F4F5F7;
            --radius-lg: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-base); color: var(--secondary); height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .portal-card { background: white; padding: 48px; border-radius: var(--radius-lg); width: 100%; max-width: 460px; box-shadow: 0 12px 24px rgba(0,36,100,0.08); text-align: center; border: 1px solid #DFE1E6; }
        .portal-icon { width: 80px; height: 80px; background: #DEEBFF; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 24px; }
        .sso-btn-wrapper { display: flex; justify-content: center; margin-top: 32px; }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="portal-icon"><i class="fa-solid fa-house-medical-circle-check"></i></div>
        <h2 style="margin-bottom: 8px;">Enterprise Staff Access</h2>
        <p style="color: #5E6C84; font-size: 14px; margin-bottom: 32px;">Log into the clinical management operating system with authorized enterprise Google credentials.</p>
        
        <div class="sso-btn-wrapper">
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
        
        <div style="margin-top: 32px; border-top: 1px solid #DFE1E6; padding-top: 16px;">
            <a href="index.html" style="color: var(--primary); font-size: 13px; font-weight: 500;"><i class="fa-solid fa-arrow-left"></i> Return to Main Website</a>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID_HERE/exec";

        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            const email = responsePayload.email;
            
            // Validate user against Google Sheet whitelist
            fetch(`${GOOGLE_SCRIPT_URL}?action=verifyUser&email=${encodeURIComponent(email)}`)
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    // Inject session metadata token in localStorage
                    localStorage.setItem("ClinicOS_Session", JSON.stringify(res.user));
                    alert(`Access Provisioned. Welcome back, ${res.user.name}. Rerouting interface...`);
                    // Reroute to Dashboard Suite
                    window.location.href = "dashboard.html";
                } else {
                    alert("Authentication Exception: " + res.error);
                }
            })
            .catch(err => {
                console.error("SSO Validation Engine Fault:", err);
                alert("Network error processing authentication.");
            });
        }
    </script>
</body>
</html>
